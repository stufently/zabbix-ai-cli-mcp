name: Release

# Releases are cut only from an explicit tag. Nothing is published on a push.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  # Publishing to the MCP registry authenticates with a short-lived OIDC token
  # minted for this workflow, not with a stored secret.
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The release exists once goreleaser has published the tag. This job only
  # attaches desktop-extension bundles; it does not publish anywhere else.
  mcpb:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Build .mcpb bundles
        run: VERSION="${GITHUB_REF_NAME#v}" bash scripts/build-mcpb.sh
      - name: Attach .mcpb bundles to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist-mcpb/*.mcpb --clobber
