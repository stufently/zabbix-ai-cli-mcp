name: Release

# Releases are cut only from an explicit tag. Nothing is published on a push.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  # Publishing to the MCP registry authenticates with a short-lived OIDC token
  # minted for this workflow, not with a stored secret. The same token is what
  # Sigstore signs the build provenance attestations with.
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # checksums.txt lists every archive goreleaser uploaded, so attesting
      # from it signs exactly the files a user downloads, with the digests
      # they check. `gh attestation verify` then proves an archive was built
      # by this workflow from this repository.
      - name: Attest the release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      # The image digest is read from the registry the tag was pushed to,
      # not from a local build, so the attestation names what clients pull.
      - name: Resolve the published image digest
        id: image
        run: |
          ref="ghcr.io/stufently/zabbix-ai-cli-mcp:${GITHUB_REF_NAME#v}"
          digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r '.digest')
          case "$digest" in
            sha256:*) echo "digest=$digest" >> "$GITHUB_OUTPUT" ;;
            *) echo "no digest for $ref: $digest" >&2; exit 1 ;;
          esac
      - name: Attest the container image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/stufently/zabbix-ai-cli-mcp
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  # The release exists once goreleaser has published the tag. This job
  # attaches desktop-extension bundles and adds their SHA256 lines to the
  # checksums.txt goreleaser already uploaded.
  mcpb:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
      - name: Build .mcpb bundles
        run: VERSION="${GITHUB_REF_NAME#v}" bash scripts/build-mcpb.sh
      - name: Add .mcpb lines to checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern checksums.txt --dir dist-mcpb
          bash scripts/mcpb-checksums.sh dist-mcpb dist-mcpb/checksums.txt
      - name: Attest the .mcpb bundles
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist-mcpb/*.mcpb
      - name: Attach .mcpb bundles to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist-mcpb/*.mcpb dist-mcpb/checksums.txt --clobber
