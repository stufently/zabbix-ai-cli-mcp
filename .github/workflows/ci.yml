name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.27.0"

jobs:
  check:
    name: Format, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Tests
        run: go test ./...

      # A stamp the linker cannot reach is invisible in an ordinary build: the
      # module version the toolchain records fills in and looks right.
      - name: The version stamp reaches the binary
        run: sh scripts/check-version-stamp.sh

      # The race detector matters here: aggregates fan out across goroutines
      # and write into a shared slice.
      - name: Tests with the race detector
        run: go test -race ./...

      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

  vulncheck:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  container:
    name: Container starts as a non-root user
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The image runs distroless as uid 65532 and writes plans to
      # /var/lib/zabbix-ai-cli-mcp. A missing or root-owned state directory only
      # shows up at runtime, so it is exercised here rather than assumed.
      - name: Build the image
        run: docker build -t zabbix-ai-cli-mcp:ci .
      - name: The state directory is writable
        run: |
          docker run --rm zabbix-ai-cli-mcp:ci plans list | tee /dev/stderr | grep -q '"ok": true'

      # GoReleaser builds the release image from a context holding nothing but
      # Dockerfile.release and the compiled binary. Building it any other way
      # here would not have caught the release that failed on a missing go.sum.
      - name: The release image builds from a binary-only context
        run: |
          mkdir -p /tmp/relctx
          cp Dockerfile.release /tmp/relctx/Dockerfile
          docker create --name extract zabbix-ai-cli-mcp:ci
          docker cp extract:/usr/local/bin/zabbix-ai-cli-mcp /tmp/relctx/zabbix-ai-cli-mcp
          docker rm extract
          docker build -t zabbix-ai-cli-mcp:release-ci /tmp/relctx
          docker run --rm zabbix-ai-cli-mcp:release-ci plans list | grep -q '"ok": true'

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null ./cmd/zabbix-ai-cli-mcp
