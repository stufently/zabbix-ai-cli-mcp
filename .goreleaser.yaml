version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: zabbix-ai-cli-mcp
    main: ./cmd/zabbix-ai-cli-mcp
    binary: zabbix-ai-cli-mcp
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/stufently/zabbix-ai-cli-mcp/internal/cli.Version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE, SECURITY.md, docs/*, skills/**/*]

checksum:
  name_template: checksums.txt

dockers:
  - image_templates:
      - "ghcr.io/stufently/zabbix-ai-cli-mcp:{{ .Version }}"
      - "ghcr.io/stufently/zabbix-ai-cli-mcp:latest"
    dockerfile: Dockerfile.release
    build_flag_templates:
      - "--build-arg=VERSION={{ .Version }}"
      # The registry checks this label against the published server name, so an
      # image nobody can trace back to the manifest is rejected.
      - '--label=io.modelcontextprotocol.server.name=io.github.stufently/zabbix-ai-cli-mcp'
      - "--label=org.opencontainers.image.source=https://github.com/stufently/zabbix-ai-cli-mcp"
      - "--label=org.opencontainers.image.description=AI-first CLI and MCP server for Zabbix"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"

# The official MCP registry is how MCP clients find servers at all: it is the
# index the directories and the clients themselves read. Publishing is part of
# cutting a release rather than a thing to remember afterwards.
mcp:
  name: io.github.stufently/zabbix-ai-cli-mcp
  title: "Zabbix AI CLI MCP"
  description: "Task-shaped Zabbix access for AI agents: problems, host triage, metrics, maintenance windows."
  homepage: "https://github.com/stufently/zabbix-ai-cli-mcp"
  auth:
    # OIDC proves the release came from this repository's own workflow, so no
    # long-lived registry credential has to exist anywhere.
    type: github-oidc
  repository:
    url: "https://github.com/stufently/zabbix-ai-cli-mcp"
    source: github
    id: "1341361308"
  packages:
    - registry_type: oci
      identifier: "ghcr.io/stufently/zabbix-ai-cli-mcp:{{ .Version }}"
      transport:
        type: stdio
  # A release candidate must not become the version every client installs.
  disable: auto

changelog:
  use: github
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  # The repository is public: a draft leaves whoever comes for a release
  # looking at an older tag as the latest one.
  draft: false
